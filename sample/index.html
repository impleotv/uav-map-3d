<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>UAV Map 3D example</title>
<style>html,body,#scene{margin:0;width:100%;height:100%;font:14px system-ui}#secondary{position:absolute;right:0;top:0;width:50%;height:100%}#errors{color:#ffaaa0}#controls{position:absolute;top:12px;left:12px;z-index:2;background:#162332ee;color:white;padding:12px;border-radius:8px}button,select{margin:4px;padding:6px}#status{max-width:600px}</style></head>
<body><div id="scene"></div><div id="controls"><strong>Independent 3D renderer · 10 platforms / 500 targets / 10 Hz</strong><br/><select id="platform"></select><button id="fit">Fit all</button><button id="follow">Follow</button><button id="sensor">Sensor view</button><button id="orbit">Free orbit</button><button id="secondary-toggle">Open second view</button><button id="target-closeup">Target close-up</button><label><input id="targets" type="checkbox" checked/> Show VMTI targets</label><label><input id="pause" type="checkbox"/> Pause metadata</label><div id="status"></div><div id="errors" role="alert"></div></div><script type="module" src="/main.ts"></script></body></html>
